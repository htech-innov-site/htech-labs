<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H TECH Labs — Espace de test des plateformes H TECH INNOV</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
:root{--navy:#0A2A66;--navy2:#061C48;--blue:#1565C0;--green:#3F8A1E;--green-l:#EDF6E8;--light:#F4F7FC;--line:#D5E0F0;--txt:#1E283C;--grey:#5E6B82;--amber:#B45309;--red:#B42318;--r:10px}
*{box-sizing:border-box}html,body{margin:0}body{font-family:'Source Sans 3',system-ui,sans-serif;color:var(--txt);background:var(--light);font-size:16px;line-height:1.5}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif;color:var(--navy);margin:0;line-height:1.2}h1{font-size:28px;font-weight:800}h2{font-size:19px;font-weight:700}h3{font-size:16px;font-weight:700}
a{color:var(--blue)}button,input,select,textarea{font:inherit}
:focus-visible{outline:3px solid #9CC3F5;outline-offset:2px}
.barre{height:5px;background:linear-gradient(90deg,var(--navy) 0 85%,var(--green) 85%)}
header.top{background:#fff;border-bottom:1px solid var(--line)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:68px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}.logo svg{flex:none}
.logo b{font-family:Montserrat;font-weight:800;color:var(--navy);font-size:18px;letter-spacing:.2px}.logo span{display:block;font-size:12.5px;color:var(--grey);margin-top:-2px}
.qui{display:flex;align-items:center;gap:12px;font-size:14.5px;color:var(--grey)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--navy);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:15px}
.btn:hover{border-color:var(--blue)}.btn.p{background:var(--navy);border-color:var(--navy);color:#fff}.btn.p:hover{background:var(--blue);border-color:var(--blue)}
.btn.g{background:var(--green);border-color:var(--green);color:#fff}.btn.s{padding:5px 10px;font-size:14px}.btn[disabled]{opacity:.5;cursor:not-allowed}
main{padding:28px 0 60px}
.carte{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:20px}
.grille{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
.pile>*+*{margin-top:20px}
.note{color:var(--grey);font-size:14.5px}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 4px;color:var(--navy)}
.in{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.in:focus{border-color:var(--blue)}
.err{color:var(--red);font-size:14.5px;min-height:20px;margin-top:8px}
/* Connexion */
.cnx{min-height:calc(100vh - 5px);display:grid;grid-template-columns:1.1fr 1fr}
.cnx .gauche{background:var(--navy);color:#fff;padding:56px 48px;display:flex;flex-direction:column;justify-content:space-between}
.cnx .gauche h1{color:#fff;font-size:34px;max-width:420px}.cnx .gauche p{color:#C8D4EA;max-width:440px;font-size:17px}
.cnx .droite{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.cnx form{width:100%;max-width:380px}
/* Frise de la période de test : l'élément central */
.frise{margin-top:18px}
.frise .rail{position:relative;height:14px;border-radius:7px;background:#E3EAF6;overflow:visible}
.frise .fait{position:absolute;inset:0 auto 0 0;border-radius:7px;background:var(--blue)}
.frise .auj{position:absolute;top:-8px;width:3px;height:30px;background:var(--navy);border-radius:2px;transform:translateX(-1px)}
.frise .dates{display:flex;justify-content:space-between;font-size:14px;color:var(--grey);margin-top:10px}
.frise .reste{font-family:Montserrat;font-weight:800;color:var(--navy);font-size:22px}
.frise.alerte .fait{background:var(--amber)}
.etat{display:inline-block;font-size:13.5px;font-weight:700;padding:2px 10px;border-radius:20px;background:var(--green-l);color:var(--green)}
.etat.suspendu,.etat.termine{background:#FDECEC;color:var(--red)}.etat.converti{background:#E5EFFB;color:var(--blue)}
/* Plateformes : rangées, pas des cartes identiques */
.plat{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:16px 0;border-top:1px solid var(--line)}
.plat:first-of-type{border-top:0}
.plat .ico{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--light);color:var(--navy)}
.plat p{margin:2px 0 0;color:var(--grey);font-size:14.5px}
.tag{font-size:13px;color:var(--grey);font-weight:600}
.lst{list-style:none;margin:0;padding:0}.lst li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}.lst li:first-child{border-top:0}
.etoiles{display:flex;gap:4px}.etoiles button{border:1px solid var(--line);background:#fff;border-radius:8px;width:40px;height:36px;cursor:pointer;font-weight:700;color:var(--navy)}
.etoiles button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
/* Console équipe */
table{width:100%;border-collapse:collapse;font-size:15px}th{text-align:left;color:var(--grey);font-weight:600;font-size:13.5px;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.mini{height:6px;border-radius:3px;background:#E3EAF6;width:120px;position:relative}.mini i{position:absolute;inset:0 auto 0 0;border-radius:3px;background:var(--blue)}
.mini.alerte i{background:var(--amber)}
dialog{border:0;border-radius:12px;padding:0;max-width:560px;width:calc(100% - 32px);box-shadow:0 20px 60px rgba(6,28,72,.25)}
dialog::backdrop{background:rgba(6,28,72,.45)}
dialog .hd{padding:18px 20px;border-bottom:1px solid var(--line)}dialog .bd{padding:4px 20px 20px}dialog .ft{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;font-weight:700;color:var(--navy);background:var(--light);padding:2px 8px;border-radius:6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 18px;border-radius:8px;font-size:15px;z-index:99}
.choix{display:flex;flex-wrap:wrap;gap:8px}.choix label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);padding:6px 10px;border-radius:8px;font-size:14.5px}
@media (max-width:860px){.grille{grid-template-columns:1fr}.cnx{grid-template-columns:1fr}.cnx .gauche{padding:32px 24px}.cnx .gauche h1{font-size:26px}table .opt{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="barre"></div>
<div id="app" aria-live="polite"></div>
<script>
// ── Configuration : projet Supabase DÉDIÉ « htech-labs » (jamais celui de l'ERP) ──
const SUPABASE_URL='https://lqmgmkbwrkggvlvjrufo.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxbWdta2J3cmtnZ3ZsdmpydWZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE2NDMwMDcsImV4cCI6MjEwNzIxOTAwN30.Cvyviw8ZmQgs43ZrILTWj4mh81r_hYoR1hlamypLOVg';
const DOMAINE='labs.htechinnov.com';           // adresse technique des identifiants
const WHATSAPP='2250714942421';
// Plateformes du catalogue. « pret: true » quand la plateforme est déployée dans /<chemin>/ du même domaine.
const PLATEFORMES=[
 {k:'urbain',nom:'Suivi des projets urbains',desc:'Carte des projets, avancement physique et financier, photos de chantier, rapports de pilotage.',chemin:'urbain/',pret:true,ico:'M4 20V9l8-5 8 5v11M9 20v-6h6v6'},
 {k:'ged',nom:'Collaboration et documents',desc:'Espaces projet, versions des plans, circuits de visa, annotations et comptes rendus.',chemin:'ged/',pret:true,ico:'M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6'},
 {k:'education',nom:'Formation et apprentissage',desc:'Espaces apprenants et formateurs, cours, devoirs, suivi de progression, certificats.',chemin:'education/',pret:true,ico:'M3 8l9-4 9 4-9 4zM7 10v5c3 2 7 2 10 0v-5'},
 {k:'pme',nom:'Gestion commerciale',desc:'Devis, factures, bons de commande, clients et fournisseurs, tableaux de bord.',chemin:'pme/',pret:true,ico:'M4 4h16v16H4zM8 9h8M8 13h8M8 17h5'},
 {k:'industrie',nom:'Maintenance et QHSE',desc:'Parc d’équipements, interventions, maintenance préventive, incidents et audits.',chemin:'industrie/',pret:true,ico:'M12 8a4 4 0 100 8 4 4 0 000-8zM12 2v3M12 19v3M2 12h3M19 12h3'}];
const SECTEURS=['Collectivité / administration','Bureau d’études / ingénierie','BTP / construction','Éducation / formation','Industrie','Technologie / services','Autre'];

const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let USER=null,EQUIPE=false,ESPACE=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dfr=d=>d?new Date(String(d).slice(0,10)+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'}):'';
function toast(m,ms=3500){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
const ico=d=>`<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${d}"/></svg>`;
const logo=`<a class="logo" href="#"><svg width="34" height="22" viewBox="0 0 34 22" aria-hidden="true"><g fill="none" stroke="#0A2A66" stroke-width="3.2" stroke-linecap="round"><path d="M3 20a14 14 0 0128 0"/><path d="M9 20a8 8 0 0116 0"/><path d="M14.5 20a2.5 2.5 0 015 0"/></g></svg><div><b>H TECH Labs</b><span>Espace de test H TECH INNOV</span></div></a>`;
function entete(){return `<header class="top"><div class="wrap">${logo}<div class="qui"><span>${esc(USER?.user_metadata?.nom||'')}</span><button class="btn s" onclick="deconnexion()">Se déconnecter</button></div></div></header>`;}

// ── Connexion ──
function pageConnexion(){
  $('#app').innerHTML=`<div class="cnx"><section class="gauche"><div>${logo.replace('#0A2A66','#ffffff').replace('<b>','<b style="color:#fff">')}</div>
    <div><h1>Testez nos plateformes avec vos propres données, pendant 3 mois.</h1><p>Votre espace est réservé à votre organisation. Personne d’autre n’y a accès, pas même H TECH INNOV sans votre autorisation.</p></div>
    <p style="font-size:14px;color:#9FB2D4">H TECH INNOV · Cocody Riviera Jules Verne, Abidjan · 27 22 56 28 37</p></section>
    <section class="droite"><form onsubmit="event.preventDefault();connexion()"><h2>Se connecter</h2><p class="note">Avec l’identifiant et le mot de passe remis par H TECH INNOV.</p>
      <label class="f" for="cId">Identifiant</label><input class="in" id="cId" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="ex. a.kone.mairie" required>
      <label class="f" for="cMdp">Mot de passe</label><input class="in" id="cMdp" type="password" autocomplete="current-password" required>
      <div class="err" id="cErr"></div><button class="btn p" style="width:100%;justify-content:center;margin-top:6px">Se connecter</button>
      <p class="note" style="margin-top:16px">Mot de passe oublié ? <a href="https://wa.me/${WHATSAPP}?text=${encodeURIComponent('Bonjour, j’ai oublié mon mot de passe H TECH Labs.')}" target="_blank" rel="noopener">Demandez-en un nouveau sur WhatsApp</a>.</p></form></section></div>`;
  $('#cId').focus();
}
async function connexion(){
  const v=$('#cId').value.trim(),m=$('#cMdp').value,e=$('#cErr');e.textContent='';
  const{error}=await sb.auth.signInWithPassword({email:v.includes('@')?v:v.toLowerCase()+'@'+DOMAINE,password:m});
  if(error){e.textContent='Identifiant ou mot de passe incorrect.';return;}
  await demarrer();
}
async function deconnexion(){await sb.auth.signOut();USER=null;pageConnexion();}
function pageMotDePasse(){
  $('#app').innerHTML=`${entete()}<main><div class="wrap" style="max-width:460px"><div class="carte"><h1 style="font-size:24px">Choisissez votre mot de passe</h1>
    <p class="note">Le mot de passe provisoire a fonctionné. Remplacez-le par un mot de passe personnel d’au moins 8 caractères.</p>
    <form onsubmit="event.preventDefault();changerMdp()"><label class="f" for="m1">Nouveau mot de passe</label><input class="in" id="m1" type="password" minlength="8" autocomplete="new-password" required>
    <label class="f" for="m2">Confirmation</label><input class="in" id="m2" type="password" minlength="8" autocomplete="new-password" required><div class="err" id="mErr"></div>
    <button class="btn p">Enregistrer et continuer</button></form></div></div></main>`;
}
async function changerMdp(){
  const a=$('#m1').value,b=$('#m2').value,e=$('#mErr');if(a!==b){e.textContent='Les deux mots de passe sont différents.';return;}
  const{data,error}=await sb.auth.updateUser({password:a,data:{mdp_provisoire:false}});
  if(error){e.textContent=/same|different/i.test(error.message)?'Choisissez un mot de passe différent du mot de passe provisoire.':error.message;return;}
  USER=data.user;toast('Mot de passe enregistré');demarrer();
}

// ── Démarrage : partenaire ou équipe H TECH INNOV ──
async function demarrer(){
  const{data}=await sb.auth.getSession();USER=data.session?.user||null;
  if(!USER)return pageConnexion();
  if(USER.user_metadata?.mdp_provisoire)return pageMotDePasse();
  const{data:eq}=await sb.rpc('labs_est_equipe');EQUIPE=!!eq;
  if(EQUIPE)return pageConsole();
  const{data:esp}=await sb.rpc('labs_mon_espace');ESPACE=(esp||[])[0]||null;
  if(!ESPACE){$('#app').innerHTML=`${entete()}<main><div class="wrap"><div class="carte"><h2>Aucun espace n’est rattaché à ce compte</h2><p class="note">Contactez H TECH INNOV au 27 22 56 28 37.</p></div></div></main>`;return;}
  if(!sessionStorage.getItem('labs_cnx')){sessionStorage.setItem('labs_cnx','1');sb.from('labs_journal').insert({tenant_id:ESPACE.tenant_id,plateforme:'portail',action:'connexion'}).then(()=>{});}
  pageEspace();
}

// ── Espace partenaire ──
function frise(e){
  const d0=new Date(e.date_debut+'T12:00:00'),d1=new Date(e.date_fin+'T12:00:00'),now=new Date();
  const tot=Math.max(1,(d1-d0)/864e5),pas=Math.min(tot,Math.max(0,(now-d0)/864e5)),pct=100*pas/tot,alerte=e.jours_restants<=15;
  return `<div class="frise ${alerte?'alerte':''}"><div class="rail" role="progressbar" aria-valuemin="0" aria-valuemax="${Math.round(tot)}" aria-valuenow="${Math.round(pas)}" aria-label="Période de test">
    <div class="fait" style="width:${pct}%"></div><div class="auj" style="left:${pct}%"></div></div>
    <div class="dates"><span>Début : ${dfr(e.date_debut)}</span><span>Fin : ${dfr(e.date_fin)}</span></div>
    <p style="margin:10px 0 0"><span class="reste">${e.jours_restants} jour${e.jours_restants>1?'s':''}</span> <span class="note">restant${e.jours_restants>1?'s':''} sur votre période de test</span></p></div>`;
}
async function pageEspace(){
  const e=ESPACE,admin=e.role==='admin';
  const actives=PLATEFORMES.filter(p=>(e.plateformes||[]).includes(p.k)),autres=PLATEFORMES.filter(p=>!(e.plateformes||[]).includes(p.k));
  const{data:membres}=await sb.from('labs_membres').select('user_id,nom,identifiant,role').eq('tenant_id',e.tenant_id).order('nom');
  const support=e.support_jusqua&&new Date(e.support_jusqua)>new Date();
  $('#app').innerHTML=`${entete()}<main><div class="wrap">
    <section class="carte" style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline">
      <div><h1>${esc(e.nom)}</h1><p class="note" style="margin:4px 0 0">${esc(e.secteur||'')}</p></div><span class="etat ${esc(e.statut)}">${{actif:'Test en cours',suspendu:'Suspendu',termine:'Test terminé',converti:'Solution retenue'}[e.statut]||e.statut}</span></div>
      ${frise(e)}</section>
    <div class="grille"><div class="pile">
      <section class="carte"><h2>Vos plateformes</h2>
        ${actives.map(p=>`<div class="plat"><div class="ico">${ico(p.ico)}</div><div><h3>${esc(p.nom)}</h3><p>${esc(p.desc)}</p></div>
          ${p.pret&&e.statut==='actif'?`<a class="btn p" href="${p.chemin}" onclick="journal('${p.k}','ouverture')">Ouvrir</a>`:`<span class="tag">En préparation</span>`}</div>`).join('')||'<p class="note">Aucune plateforme n’est encore activée pour votre espace.</p>'}
        ${autres.length?`<p class="note" style="margin-top:14px">Autres plateformes disponibles sur demande : ${autres.map(p=>esc(p.nom)).join(', ')}.</p>`:''}</section>
      <section class="carte"><h2>Votre avis</h2><p class="note">Ce qui vous est utile, ce qui manque, ce qui gêne : vos retours orientent le développement de votre solution.</p>
        <div class="etoiles" role="group" aria-label="Note sur 5">${[1,2,3,4,5].map(n=>`<button type="button" aria-pressed="false" onclick="noter(${n})">${n}</button>`).join('')}</div>
        <label class="f" for="avPl">Plateforme</label><select class="in" id="avPl">${actives.map(p=>`<option value="${p.k}">${esc(p.nom)}</option>`).join('')}<option value="general">Général</option></select>
        <label class="f" for="avTx">Commentaire</label><textarea class="in" id="avTx" rows="3"></textarea>
        <button class="btn p" style="margin-top:10px" onclick="envoyerAvis()">Envoyer mon avis</button></section>
    </div><aside class="pile">
      <section class="carte"><h2>Votre équipe</h2><ul class="lst" style="margin-top:8px">${(membres||[]).map(m=>`<li><span>${esc(m.nom)}<br><span class="note">${esc(m.identifiant)}${m.role==='admin'?' · administrateur':''}</span></span>
        ${admin&&m.user_id!==USER.id?`<button class="btn s" onclick="reinitialiser('${m.user_id}')">Nouveau mot de passe</button>`:''}</li>`).join('')}</ul>
        ${admin?`<button class="btn" style="margin-top:12px" onclick="dlgMembre('${e.tenant_id}',false)">Ajouter un collaborateur</button>`:''}</section>
      <section class="carte"><h2>Accès de l’assistance</h2>
        <p class="note">${support?`L’équipe H TECH INNOV peut consulter vos données jusqu’au ${dfr(e.support_jusqua)}, pour vous assister.`:'L’équipe H TECH INNOV n’a pas accès à vos données. Vous pouvez l’autoriser temporairement si vous avez besoin d’aide.'}</p>
        ${admin?(support?`<button class="btn" onclick="support(0)">Retirer l’accès</button>`:`<button class="btn" onclick="support(7)">Autoriser pendant 7 jours</button>`):''}</section>
      <section class="carte"><h2>Besoin d’aide ?</h2><p class="note">Standard 27 22 56 28 37 · <a href="https://wa.me/${WHATSAPP}" target="_blank" rel="noopener">WhatsApp</a> · info@htechinnov.com</p></section>
    </aside></div></div></main>`;
}
let NOTE=0;
function noter(n){NOTE=n;document.querySelectorAll('.etoiles button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i<n)));}
async function envoyerAvis(){
  const c=$('#avTx').value.trim();if(!NOTE&&!c){toast('Donnez une note ou écrivez un commentaire');return;}
  const{error}=await sb.from('labs_retours').insert({tenant_id:ESPACE.tenant_id,plateforme:$('#avPl').value,note:NOTE||null,commentaire:c||null});
  if(error){toast('Envoi impossible : '+error.message);return;}NOTE=0;toast('Merci, votre avis a été transmis à H TECH INNOV');pageEspace();
}
function journal(p,a){sb.from('labs_journal').insert({tenant_id:ESPACE.tenant_id,plateforme:p,action:a}).then(()=>{});}
async function support(j){
  const{error}=await sb.rpc('labs_autoriser_support',{p_tenant:ESPACE.tenant_id,p_jours:j});if(error){toast(error.message);return;}
  toast(j?'Accès de l’assistance autorisé pendant '+j+' jours':'Accès de l’assistance retiré');const{data}=await sb.rpc('labs_mon_espace');ESPACE=data[0];pageEspace();
}

// ── Comptes (fonction serveur labs-comptes) ──
async function comptes(body){const{data,error}=await sb.functions.invoke('labs-comptes',{body});if(error&&!data)throw new Error(error.message);if(data?.error)throw new Error(data.error);return data;}
function dialogue(titre,corps,pied){let d=$('#dlg');if(!d){d=document.createElement('dialog');d.id='dlg';document.body.appendChild(d);}
  d.innerHTML=`<div class="hd"><h2>${titre}</h2></div><div class="bd">${corps}</div><div class="ft">${pied}</div>`;if(!d.open)d.showModal();return d;}
function fermer(){$('#dlg')?.close();}
function dlgMembre(tid,adminPossible){
  dialogue('Ajouter un collaborateur',`<label class="f" for="nPr">Prénom</label><input class="in" id="nPr"><label class="f" for="nNo">Nom</label><input class="in" id="nNo">
    <label class="f" for="nTe">Téléphone (pour l’envoi WhatsApp)</label><input class="in" id="nTe" inputmode="tel">
    ${adminPossible?`<label style="display:flex;gap:8px;align-items:center;margin-top:12px"><input type="checkbox" id="nAd"> Administrateur de l’espace</label>`:''}<div class="err" id="nErr"></div>`,
    `<button class="btn" onclick="fermer()">Annuler</button><button class="btn p" id="nGo" onclick="creerMembre('${tid}')">Créer l’accès</button>`);
}
async function creerMembre(tid){
  const b=$('#nGo');b.disabled=true;
  try{const r=await comptes({action:'membre',tenant_id:tid,prenom:$('#nPr').value,nom:$('#nNo').value,telephone:$('#nTe').value,role:$('#nAd')?.checked?'admin':'utilisateur'});afficherAcces(r.acces);}
  catch(e){$('#nErr').textContent=e.message;b.disabled=false;}
}
async function reinitialiser(uid){if(!confirm('Générer un nouveau mot de passe provisoire ? L’ancien ne fonctionnera plus.'))return;
  try{const r=await comptes({action:'reinitialiser',user_id:uid});afficherAcces(r.acces);}catch(e){toast(e.message);}}
function afficherAcces(a){
  const url=location.origin+location.pathname,msg=`Bonjour ${a.nom},\nVoici votre accès à H TECH Labs${a.espace?' ('+a.espace+')':''} :\n${url}\nIdentifiant : ${a.identifiant}\nMot de passe provisoire : ${a.mot_de_passe}\nÀ la première connexion, vous choisirez votre propre mot de passe.\nH TECH INNOV — 27 22 56 28 37`;
  window._MSG=msg;let tel=String(a.telephone||'').replace(/\D/g,'');if(tel.length===10)tel='225'+tel;
  dialogue('Accès à transmettre',`<p>${esc(a.nom)}</p><p>Identifiant <span class="code">${esc(a.identifiant)}</span></p><p>Mot de passe provisoire <span class="code">${esc(a.mot_de_passe)}</span></p>
    <p class="note">Transmettez ces informations maintenant : le mot de passe ne sera plus affiché après fermeture.</p>`,
    `${tel?`<a class="btn g" target="_blank" rel="noopener" href="https://wa.me/${tel}?text=${encodeURIComponent(msg)}">Envoyer sur WhatsApp</a>`:''}<button class="btn" onclick="navigator.clipboard.writeText(window._MSG).then(()=>toast('Message copié'))">Copier le message</button><button class="btn p" onclick="fermer();demarrer()">Terminé</button>`);
}

// ── Console de l'équipe H TECH INNOV ──
async function pageConsole(){
  const[{data:T},{data:M},{data:J},{data:R}]=await Promise.all([sb.from('labs_tenants').select('*').order('date_fin'),sb.from('labs_membres').select('tenant_id'),
    sb.from('labs_journal').select('tenant_id,at').order('at',{ascending:false}).limit(2000),sb.from('labs_retours').select('*').order('created_at',{ascending:false}).limit(50)]);
  const auj=new Date(),jr=t=>Math.max(0,Math.round((new Date(t.date_fin+'T12:00:00')-auj)/864e5));
  const pct=t=>{const a=new Date(t.date_debut+'T12:00:00'),b=new Date(t.date_fin+'T12:00:00');return Math.min(100,Math.max(0,100*(auj-a)/Math.max(1,b-a)));};
  const nbM=id=>(M||[]).filter(m=>m.tenant_id===id).length,der=id=>(J||[]).find(j=>j.tenant_id===id)?.at,act=id=>(J||[]).filter(j=>j.tenant_id===id).length;
  window._T=T||[];
  $('#app').innerHTML=`${entete()}<main><div class="wrap">
    <div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:18px"><div><h1>Espaces partenaires</h1><p class="note" style="margin:4px 0 0">${(T||[]).filter(t=>t.statut==='actif').length} tests en cours · ${(T||[]).filter(t=>t.statut==='actif'&&jr(t)<=15).length} se terminent dans 15 jours ou moins</p></div>
      <button class="btn p" onclick="dlgEspace()">Ouvrir un espace</button></div>
    <section class="carte" style="overflow-x:auto"><table><thead><tr><th>Partenaire</th><th class="opt">Plateformes</th><th>Période</th><th>Comptes</th><th class="opt">Activité</th><th>Statut</th><th></th></tr></thead><tbody>
    ${(T||[]).map(t=>`<tr><td><strong>${esc(t.nom)}</strong><br><span class="note">${esc(t.secteur||'')}${t.contact_nom?' · '+esc(t.contact_nom):''}</span></td>
      <td class="opt" style="font-size:14px">${(t.plateformes||[]).map(k=>esc(PLATEFORMES.find(p=>p.k===k)?.nom||k)).join('<br>')}</td>
      <td><div class="mini ${t.statut==='actif'&&jr(t)<=15?'alerte':''}"><i style="width:${pct(t)}%"></i></div><span class="note">${t.statut==='actif'?jr(t)+' j restants':'jusqu’au '+dfr(t.date_fin)}</span></td>
      <td>${nbM(t.id)} / ${t.max_membres}</td><td class="opt note">${act(t.id)} actions${der(t.id)?'<br>dernière le '+dfr(der(t.id)):''}</td>
      <td><select class="in" style="padding:5px 8px;width:auto" onchange="statut('${t.id}',this.value)">${['actif','suspendu','termine','converti'].map(s=>`<option value="${s}" ${s===t.statut?'selected':''}>${{actif:'En test',suspendu:'Suspendu',termine:'Terminé',converti:'Converti'}[s]}</option>`).join('')}</select></td>
      <td style="white-space:nowrap"><button class="btn s" onclick="dlgMembre('${t.id}',true)">Ajouter un compte</button> <button class="btn s" onclick="prolonger('${t.id}')">+30 j</button></td></tr>`).join('')
      ||'<tr><td colspan="7" class="note" style="padding:20px">Aucun espace. Ouvrez le premier pour un partenaire pilote.</td></tr>'}</tbody></table></section>
    <section class="carte" style="margin-top:20px"><h2>Derniers avis des partenaires</h2><ul class="lst" style="margin-top:8px">
      ${(R||[]).map(r=>`<li><span><strong>${esc((T||[]).find(t=>t.id===r.tenant_id)?.nom||'')}</strong> · ${esc(PLATEFORMES.find(p=>p.k===r.plateforme)?.nom||r.plateforme||'')}<br>${esc(r.commentaire||'')}</span><span class="note">${r.note?r.note+'/5':''}<br>${dfr(r.created_at)}</span></li>`).join('')||'<li class="note">Aucun avis pour le moment.</li>'}</ul></section>
  </div></main>`;
}
const slug=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
function dlgEspace(){
  const d0=new Date().toISOString().slice(0,10);
  dialogue('Ouvrir un espace partenaire',`<label class="f" for="eNom">Organisation</label><input class="in" id="eNom" oninput="$('#eCode').value=slug(this.value)">
    <label class="f" for="eCode">Code de l’espace (sert aux identifiants)</label><input class="in" id="eCode" pattern="[a-z0-9-]{3,40}">
    <label class="f" for="eSec">Secteur</label><select class="in" id="eSec">${SECTEURS.map(s=>`<option>${esc(s)}</option>`).join('')}</select>
    <label class="f" for="eCon">Contact principal (nom, téléphone)</label><input class="in" id="eCon" placeholder="M. Koné · 07 00 00 00 00">
    <label class="f">Plateformes à tester</label><div class="choix">${PLATEFORMES.map(p=>`<label><input type="checkbox" value="${p.k}" class="ePl"> ${esc(p.nom)}</label>`).join('')}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px"><div><label class="f" for="eDeb">Début</label><input class="in" id="eDeb" type="date" value="${d0}"></div>
    <div><label class="f" for="eMois">Durée (mois)</label><input class="in" id="eMois" type="number" min="1" max="6" value="3"></div><div><label class="f" for="eMax">Comptes max</label><input class="in" id="eMax" type="number" min="1" max="50" value="10"></div></div>
    <div class="err" id="eErr"></div>`,`<button class="btn" onclick="fermer()">Annuler</button><button class="btn p" onclick="creerEspace()">Ouvrir l’espace</button>`);
}
async function creerEspace(){
  const nom=$('#eNom').value.trim(),code=$('#eCode').value.trim(),deb=$('#eDeb').value,mois=parseInt($('#eMois').value)||3;
  const pl=[...document.querySelectorAll('.ePl:checked')].map(x=>x.value);
  if(!nom||!/^[a-z0-9-]{3,40}$/.test(code)){$('#eErr').textContent='Nom et code (minuscules, chiffres, tirets) requis.';return;}
  if(!pl.length){$('#eErr').textContent='Choisissez au moins une plateforme.';return;}
  const f=new Date(deb+'T12:00:00');f.setMonth(f.getMonth()+mois);f.setDate(f.getDate()-1);
  const[cn,...ct]=$('#eCon').value.split(/[·,;]/);
  const{data,error}=await sb.from('labs_tenants').insert({nom,code,secteur:$('#eSec').value,contact_nom:(cn||'').trim()||null,contact_tel:ct.join(' ').trim()||null,plateformes:pl,date_debut:deb,date_fin:f.toISOString().slice(0,10),max_membres:parseInt($('#eMax').value)||10,created_by:USER.id}).select('id').single();
  if(error){$('#eErr').textContent=/duplicate|unique/i.test(error.message)?'Ce code est déjà utilisé.':error.message;return;}
  toast('Espace ouvert. Créez maintenant le compte administrateur du partenaire.');dlgMembre(data.id,true);
  const ad=$('#nAd');if(ad)ad.checked=true;
}
async function statut(id,s){const{error}=await sb.from('labs_tenants').update({statut:s,updated_at:new Date().toISOString()}).eq('id',id);toast(error?error.message:'Statut mis à jour');pageConsole();}
async function prolonger(id){const t=window._T.find(x=>x.id===id);const f=new Date(t.date_fin+'T12:00:00');f.setDate(f.getDate()+30);
  if(!confirm('Prolonger le test de '+t.nom+' jusqu’au '+dfr(f.toISOString())+' ?'))return;
  const{error}=await sb.from('labs_tenants').update({date_fin:f.toISOString().slice(0,10),updated_at:new Date().toISOString()}).eq('id',id);toast(error?error.message:'Période prolongée de 30 jours');pageConsole();}

demarrer();
</script>
</body>
</html>
